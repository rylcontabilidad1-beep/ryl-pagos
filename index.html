<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#b40016">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RYL Pagos">
  <title>RYL Pagos</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7e7e9;font-family:Arial,sans-serif}
    .shell{position:fixed;inset:0;background:
      radial-gradient(circle at 105% 0%,rgba(235,0,34,.22),transparent 28%),
      linear-gradient(145deg,#fff 0%,#f8ecee 55%,#efc9ce 100%)}
    iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
    .loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;color:#101828}
    .logo{width:92px;height:92px;border-radius:24px;background:linear-gradient(145deg,#d60020,#820000);display:grid;place-items:center;color:white;font-weight:900;font-size:34px;box-shadow:0 18px 40px rgba(140,0,0,.24)}
    .loading strong{font-size:22px} .loading span{font-size:13px;color:#667085}
  </style>
</head>
<body>
  <div class="shell">
    <div class="loading" id="loading">
      <div class="logo">RYL</div>
      <strong>RYL Pagos</strong>
      <span>Cargando Calendario de Pagos…</span>
    </div>
    <iframe id="app" title="RYL Pagos" src="https://script.google.com/macros/s/AKfycbwkfj7wdAkGCMT6YEbOSEB08kar-e6YQ0YfsNQMtMvqTV6-Ke2ZbjxVeCIrneYL3Rg/exec" allow="clipboard-read; clipboard-write" onload="document.getElementById('loading').style.display='none'"></iframe>
  </div>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
    }
  </script>
</body>
</html>
